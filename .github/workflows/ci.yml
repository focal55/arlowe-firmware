name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python tests (runtime/lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches Debian bookworm's system python3, which is what the image runs.
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/lib/requirements.txt -r runtime/lib/requirements-dev.txt
      - name: Run tests
        env:
          ARLOWE_SCHEMA_PATH: config/schema.yml
          ARLOWE_DEFAULTS_PATH: config/defaults.yml
          ARLOWE_CONFIG_PATH: /nonexistent
          # runtime, not just runtime/lib: `voice` is a PEP 420 namespace package
          # under runtime/, so voice.wake_gate only resolves with runtime on the
          # path. runtime/voice/tests deliberately carries no __init__.py, so it
          # cannot collide with runtime/lib/tests' top-level `tests` package when
          # both suites are collected in one invocation (07.1-02 decision 1) --
          # do not "fix" that by adding the file.
          PYTHONPATH: runtime:runtime/lib
        # The wake-gate suite needs no third-party package by construction. If it
        # ever does, this cheap job says so, which is the signal worth having.
        run: python -m pytest runtime/lib/tests/ runtime/voice/tests/ -q

  # This job is the enforcement authority for the Debian bookworm cryptography
  # API floor (38.0.4) that runtime/lib code must stay within. The image runs
  # system python3 with apt packages -- /opt/arlowe/venvs is empty -- so a pip
  # resolve would only approximate the real surface. The apt list below must
  # cover every python3-* entry in pi-gen/stage-arlowe/00-packages/00-packages-nr
  # that runtime/lib imports; the Pi-only ones (python3-rpi.gpio, python3-spidev)
  # have no amd64 equivalent and are stubbed in tests. Do not rename this job:
  # plan 07-06 cites it by name as the proof its 38.0.4 floor claim rests on.
  python-floor-bookworm:
    name: Python tests (Debian bookworm API floor)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install image-equivalent system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-cryptography python3-requests \
            python3-yaml python3-jsonschema python3-pytest
          python3 -c "import cryptography; print(cryptography.__version__)"
      - name: Run tests
        env:
          ARLOWE_SCHEMA_PATH: config/schema.yml
          ARLOWE_DEFAULTS_PATH: config/defaults.yml
          ARLOWE_CONFIG_PATH: /nonexistent
          PYTHONPATH: runtime/lib
        run: python3 -m pytest runtime/lib/tests/ -q

  # This job is the enforcement authority for SC4: every Python import reachable
  # from a shipping unit's Exec* stanza resolves under the image's own package set.
  # Adding an import to a module that a unit entry point can reach, WITHOUT adding
  # its package to pi-gen/stage-arlowe/00-packages/00-packages-nr or to one of
  # pi-gen/stage-arlowe/01-runtime/files/venv-requirements/*.txt, must fail here --
  # before an image is ever built.
  #
  # build-image.sh's declared-packages guard cannot catch this. It verifies that
  # packages we DECLARED actually landed in the rootfs; an import nobody ever
  # declared is invisible to it. That blind spot is why python3-yaml and
  # python3-jsonschema were absent from every image until Phase 7 caught it by
  # hand, and why numpy and Pillow were still missing after that. Plan 07.1-03's
  # gate closes the "the file isn't there" half of the class; this closes the "the
  # import isn't there" half.
  #
  # Do not rename this job: plan 07.1-05's SUMMARY cites it by name as the evidence
  # SC4 rests on, and plan 07.1-06 records that citation against the ROADMAP.
  # Sibling in intent to python-floor-bookworm above: verify against the image's
  # environment, never the developer's.
  #
  # arm64, and not as a preference. python3-rpi.gpio and python3-spidev exist for
  # arm64 bookworm and do not exist for amd64 at any version, so on an amd64 runner
  # the two packages the WhisPlay display driver needs would have to be stubbed and
  # would stop being checked at all. build-image.yml already uses an arm64 runner,
  # so one is available to this repo.
  #
  # No build cache, deliberately. build-venvs.sh installs with --no-cache-dir (it
  # keeps ~/.cache/pip out of the image), so there is no pip download directory to
  # cache, and a container-layer cache is the one thing that could hide a change to
  # 00-packages-nr from the job whose entire purpose is to notice one. A fresh
  # build on a native arm64 runner is a few minutes; that is the right trade.
  unit-import-bookworm:
    name: Unit import graph (image package set)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every unit-reachable import against the image's packages
        run: bash tests/phase-07.1/run-import-check.sh

  # This job is the enforcement authority for Phase 7.2 SC5: two independent
  # resolutions from the same commit produce byte-identical package version sets.
  #
  # What it catches that nothing else does. Every other gate on the build inputs
  # lives in build-image.sh and therefore only runs when an image is built, which
  # is a tag/dispatch event on a 30-minute job. An edit that unpins the Debian
  # snapshot -- changing the overlay's sources.list, or reintroducing a kernel
  # meta package into overlays/pi-gen/stage0/02-firmware/01-packages -- would
  # otherwise sit on main until the next image build. This notices on the PR.
  #
  # It deliberately does NOT build an image. The claim under test is that two
  # builds RESOLVE the same versions, and resolution is separable from
  # installation, so two apt resolutions answer it in minutes rather than an hour.
  #
  # arm64, and not as a preference: the pinned packages include arm64-only ones
  # (python3-rpi.gpio, python3-spidev, raspi-firmware) and the kernel controls
  # query an arm64 index. Apt-resolution evidence must also never come from the
  # trixie build host, which is why the probe runs in a debian:bookworm container.
  #
  # No build cache and no container-layer cache, for the same reason
  # unit-import-bookworm states: a cache is the one thing that could hide an input
  # change from the job whose entire purpose is to notice one.
  #
  # The probe runs in a PRISTINE container via docker run rather than as a job
  # `container:`, and that separation is load-bearing. It measures what a fresh
  # rootfs would resolve, and `apt-get install --print-uris` omits anything already
  # installed -- so installing python3-yaml for the recorder self-test in the same
  # filesystem would silently shrink the set being measured, because python3 is
  # itself in the package list under test.
  build-inputs-resolve:
    name: Build input pinning (arm64 bookworm resolution)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install the recorder's manifest-reading dependency
        run: sudo apt-get install -y --no-install-recommends python3-yaml
      - name: pi-gen overlay applier self-test
        run: bash tests/phase-07.2/test-pigen-overlay.sh
      - name: Build input recorder self-test
        run: bash tests/phase-07.2/test-record-build-inputs.sh
      - name: Model pin verifier self-test
        run: bash tests/phase-07.2/test-verify-models.sh
      - name: Two resolutions from this commit must agree
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm \
            bash tests/phase-07.2/resolve-twice.sh

  detect:
    name: Detect Node project
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.check.outputs.has_node }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f runtime/dashboard/package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  # THE PNPM PIN LIVES IN runtime/dashboard/package.json, in the `packageManager`
  # field, and nowhere else. Every pnpm/action-setup step below derives from it by
  # naming that file instead of restating a version.
  #
  # It has to be pnpm 10, not 9: runtime/dashboard/pnpm-workspace.yaml carries only
  # settings (ignoredBuiltDependencies) with no `packages` key, which pnpm 9 rejects
  # outright with "packages field missing or empty". These jobs used to say
  # `version: 10` — a floating major that would have picked up any 10.x pnpm ships,
  # while node_modules was authored by 10.15.0. With the Python side fully pinned and
  # --frozen-lockfile in force, the package manager was the last floating build input,
  # and it is the one that RESOLVES the lockfile.
  #
  # pi-gen/stage-arlowe/01-runtime/files/build-dashboard.sh reads the same field via
  # corepack and hard-fails if `pnpm --version` disagrees, so CI and the image build
  # cannot drift apart.

  # Blocking. The 5 pre-existing react-hooks/set-state-in-effect errors this job
  # surfaced once #120 was fixed are waived per-file in eslint.config.mjs and
  # tracked in issue #123, so the rule still fails any new violation.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — action-setup reads the pin from the packageManager
          # field of the package.json named here. The dashboard is not at the
          # workspace root, so the path is explicit; the action's default is
          # ./package.json, which does not exist in this repo.
          package_json_file: runtime/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — action-setup reads the pin from the packageManager
          # field of the package.json named here. The dashboard is not at the
          # workspace root, so the path is explicit; the action's default is
          # ./package.json, which does not exist in this repo.
          package_json_file: runtime/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — action-setup reads the pin from the packageManager
          # field of the package.json named here. The dashboard is not at the
          # workspace root, so the path is explicit; the action's default is
          # ./package.json, which does not exist in this repo.
          package_json_file: runtime/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # test:e2e is deliberately not wired in: it needs browsers and a running
      # Next server, which is its own change.
      - run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect, lint, typecheck, test]
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — action-setup reads the pin from the packageManager
          # field of the package.json named here. The dashboard is not at the
          # workspace root, so the path is explicit; the action's default is
          # ./package.json, which does not exist in this repo.
          package_json_file: runtime/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
