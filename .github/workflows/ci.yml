name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python tests (runtime/lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches Debian bookworm's system python3, which is what the image runs.
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/lib/requirements.txt -r runtime/lib/requirements-dev.txt
      - name: Run tests
        env:
          ARLOWE_SCHEMA_PATH: config/schema.yml
          ARLOWE_DEFAULTS_PATH: config/defaults.yml
          ARLOWE_CONFIG_PATH: /nonexistent
          PYTHONPATH: runtime/lib
        run: python -m pytest runtime/lib/tests/ -q

  # This job is the enforcement authority for the Debian bookworm cryptography
  # API floor (38.0.4) that runtime/lib code must stay within. The image runs
  # system python3 with apt packages -- /opt/arlowe/venvs is empty -- so a pip
  # resolve would only approximate the real surface. The apt list below must
  # cover every python3-* entry in pi-gen/stage-arlowe/00-packages/00-packages-nr
  # that runtime/lib imports; the Pi-only ones (python3-rpi.gpio, python3-spidev)
  # have no amd64 equivalent and are stubbed in tests. Do not rename this job:
  # plan 07-06 cites it by name as the proof its 38.0.4 floor claim rests on.
  python-floor-bookworm:
    name: Python tests (Debian bookworm API floor)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install image-equivalent system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-cryptography python3-requests \
            python3-yaml python3-jsonschema python3-pytest
          python3 -c "import cryptography; print(cryptography.__version__)"
      - name: Run tests
        env:
          ARLOWE_SCHEMA_PATH: config/schema.yml
          ARLOWE_DEFAULTS_PATH: config/defaults.yml
          ARLOWE_CONFIG_PATH: /nonexistent
          PYTHONPATH: runtime/lib
        run: python3 -m pytest runtime/lib/tests/ -q

  detect:
    name: Detect Node project
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.check.outputs.has_node }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f runtime/dashboard/package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

  # pnpm 10, not 9, in every Node job below: runtime/dashboard/pnpm-workspace.yaml
  # carries only settings (ignoredBuiltDependencies) with no `packages` key, which
  # pnpm 9 rejects outright with "packages field missing or empty". node_modules
  # was authored by pnpm 10.15.0.

  # Non-blocking against 5 pre-existing react-hooks/set-state-in-effect errors
  # that predate Phase 7 and were masked while detect keyed on a nonexistent
  # root package.json (issue #120): app/page.tsx:44, app/logs/page.tsx:53,
  # app/components/RetroActivityMonitor.tsx:56,
  # app/connectivity/components/NetworkList.tsx:58,
  # app/connectivity/components/SavedNetworksList.tsx:98.
  # continue-on-error rather than an `if:` skip: build needs [lint, ...], and a
  # skipped dependency skips the dependent. Restore blocking once #120 is fixed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    continue-on-error: true
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # test:e2e is deliberately not wired in: it needs browsers and a running
      # Next server, which is its own change.
      - run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect, lint, typecheck, test]
    if: needs.detect.outputs.has_node == 'true'
    defaults:
      run:
        working-directory: runtime/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: runtime/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
