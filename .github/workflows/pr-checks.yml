name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  conventional-commits:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            perf
            style
            ci
            build
          requireScope: false
          subjectPattern: ^[A-Za-z].+[^.]$
          subjectPatternError: |
            PR title must start with a letter and not end with a period.
            Format: `type(scope): description`
            Example: `feat(match-engine): add deterministic seeded RNG`

  size-check:
    name: PR size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Exclude generated lockfiles from the size measurement — they bloat
          # PRs that just add a single dependency and aren't human-reviewed.
          NET=$(git diff --shortstat "$BASE_SHA..$HEAD_SHA" -- \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)**/yarn.lock' \
            ':(exclude)**/Cargo.lock' \
            ':(exclude)**/poetry.lock' \
            ':(exclude)**/uv.lock' \
            ':(exclude)**/Gemfile.lock' \
            ':(exclude)**/composer.lock' \
            ':(exclude)**/go.sum' \
            ':(exclude).planning/**' \
            | awk '{print $4 + $6}')
          NET=${NET:-0}
          echo "Net lines changed (excluding lockfiles and .planning): $NET"
          # .planning/ is excluded for the same reason lockfiles are: generated prose,
          # not reviewable code. A phase's RESEARCH.md plus per-plan SUMMARY.md files
          # add 1000+ lines that tell a reviewer nothing, and they were also eating
          # each plan's own stated line budget. Measured on #117: 1534 total, 1175 of
          # it planning prose, 359 actual code.
          #
          # The cap is 600, the documented project convention. It was raised to 1500
          # "during Phase 1" and stayed there through Phase 6 (issue #121), which meant
          # the per-plan size budgets agreed at planning time had no gate behind them.
          #
          # A whole-phase branch legitimately exceeds 600 and cannot be split into
          # independent PRs — the slices are stacked, and squash-merging a base branch
          # conflicts every branch cut from it. Such a PR is waived by applying the
          # `size:phase-branch` label, which is a deliberate human act, re-triggers
          # this check (see the `labeled` event type above), and leaves a record on the
          # PR. Silently raising the number again is what produced #121.
          if printf '%s' "$PR_LABELS" | grep -q '"size:phase-branch"'; then
            echo "::warning::PR is $NET net lines, over the 600 cap. Waived by the size:phase-branch label."
            exit 0
          fi
          if [ "$NET" -gt 600 ]; then
            echo "::error::PR is too large ($NET net lines). Hard cap is 600. Split it, or apply the size:phase-branch label if this is a whole-phase branch."
            exit 1
          fi
          if [ "$NET" -gt 400 ]; then
            echo "::warning::PR exceeds 400 net lines ($NET). Consider splitting before review."
          fi

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # `**` is NOT recursive here. Actions runs this step with bash, where
          # globstar is off by default, so `**` degrades to a plain `*` and
          # matches exactly one directory level. `overlays/pi-gen/**/*.sh`
          # therefore expanded to the single file overlays/pi-gen/stage0/prerun.sh
          # -- the kernel installer at overlays/pi-gen/stage0/02-firmware/00-run.sh,
          # which that glob was added specifically to cover, was never linted.
          # pi-gen/stage-arlowe/prerun.sh and the three scripts under */files/
          # were missed the same way.
          #
          # `find` over the two trees is what the `**` was meant to say, and it
          # keeps covering scripts added later without an edit here. The count is
          # printed because a glob silently matching less than intended is the
          # defect this replaced, and a bare invocation cannot show it.
          # read loop rather than `mapfile`: this exact command is re-run by hand
          # on the Mac when verifying a change, and macOS ships bash 3.2, which
          # has no mapfile. A lint command that only runs on the runner is one
          # nobody checks before pushing.
          STAGE_SCRIPTS=()
          while IFS= read -r f; do STAGE_SCRIPTS+=("$f"); done < <(
            find pi-gen/stage-arlowe overlays/pi-gen -type f -name '*.sh' | sort
          )
          echo "Linting ${#STAGE_SCRIPTS[@]} stage/overlay scripts:"
          printf '  %s\n' "${STAGE_SCRIPTS[@]}"
          shellcheck \
            scripts/*.sh \
            scripts/provision/*.sh \
            scripts/sanitize/*.sh \
            scripts/lib/*.sh \
            scripts/pki/*.sh \
            "${STAGE_SCRIPTS[@]}" \
            tests/phase-*/*.sh \
            units/install-units.sh \
            runtime/cli/ab \
            runtime/recovery/*.sh

  unit-substrate-gate-self-test:
    name: Unit substrate gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # scripts/lib/verify-unit-execstart.sh runs per image build, but
      # build-image.sh only runs from the tag/dispatch-triggered build-image.yml.
      # Without this job the gate's negative cases would execute once, at the time
      # they were written, and never again — a later edit turning a FAIL into a
      # SKIP or a PASS would emit no signal until the next hardware checkpoint.
      # Same shape as sanitize.yml's self-test job.
      #
      # No arm64 runner and no chroot are needed: the version cases go through
      # ARLOWE_VERSION_PROBE stubs and the path cases are pure filesystem.
      - name: Run the deliberate-failure self-test
        run: bash tests/phase-07.1/test-verify-unit-execstart.sh
      - name: Run the persistent-journal gate self-test
        run: bash tests/phase-07.1/test-verify-persistent-journal.sh

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description references an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -qiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+'; then
            echo "PR links to an issue."
          else
            echo "::error::PR description must reference a linked issue with 'Closes #N', 'Fixes #N', or 'Resolves #N'."
            exit 1
          fi
