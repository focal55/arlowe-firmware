# Model artifact pinning — shared models partition (Phase 6)
#
# Strategy C (user-supplies-file): url is null, files are never committed.
# Each entry pins ONE copy of the artifact for the shared models partition
# (mounted at /opt/arlowe/models in both A and B slots — see ADR-0004).
#
# PINNED PER FILE. Every file a model needs is listed with its own sha256, and
# `filename` is relative to the models root, so the same path works for the
# staging cache, the staged tree and /opt/arlowe/models. A single digest per
# directory hid which file broke and depended on where the directory sat.
# scripts/lib/verify-models.py checks these; build-image.sh also runs it with
# --exact over the staged tree, so a file nobody listed cannot ship.
#
# A TODO digest is a hard failure. These pins were TODO placeholders that only
# warned from 06-02 (#106) until #166, and every image in between shipped its
# models unchecked.
#
# DIGESTS: every value below was hashed from the files shipped on the test card
# (image from 6a4c538) on 2026-09-25, and each one matches the bytes upstream
# serves at the pinned revision: the Hugging Face LFS sha256 for the large files,
# a download and hash for the small ones. 36 of 36 agreed.
#
# UPDATE PROCEDURE: change revision and every affected sha256 in one commit, and
# re-record docs/operations/phase-07.2-inputs.reference in the same change.
#
# Distribution rights:
#   - qwen2.5-7b-int4-ax650: Axera-optimized int4 model; redistribution
#     rights TBD.
#   - faster-whisper small.en: Apache 2.0 (OpenAI Whisper weights via Systran
#     CTranslate2 conversion). Freely redistributable.
#   - piper en_US-lessac-medium: CC BY 4.0 (Piper voice model by rhasspy).
#     Attribution required; commercial use permitted.

